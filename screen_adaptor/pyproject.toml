[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-adaptor-v2"
version = "0.1.0"
description = "Screen color optimization pipeline with closed-form RGB adjustment and LUT export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
