# ---------------------------------------------------------------------------
# LUT specialization analysis - configuration
# ---------------------------------------------------------------------------
# All relative paths are resolved against the directory containing this file.

paths:
  base_lut: ../screen_adaptor/outputs/base_lut.pt
  lut_dir: ../screen_adaptor/outputs/luts
  # Optional explicit pattern ("" -> auto-discover "cluster_<i>_lut.*").
  # Keep "{i}" as the cluster-index placeholder if you set it.
  lut_pattern: ""
  manifest: ../screen_adaptor/outputs/scene_manifest.json
  assignments: ../screen_adaptor/outputs/scene_manifest.assignments.json
  figures: figures
  data: data
  report: report.md

analysis:
  epsilon: 1.0e-6               # stabilizer for specialization score
  delta_e_metric: cie2000       # cie2000 | cie76
  slice_value: 0.5              # value of the fixed channel in 2D ΔE slices

embedding:
  method: auto                  # auto | tsne | umap | pca
  perplexity: auto              # auto -> min(30, (n_samples - 1) / 3)
  random_state: 42

image_stats:
  enabled: true                 # per-cluster scene statistics + correlations
  max_images_per_cluster: 60
  max_size: 128
  histogram_bins: 32
  sample_seed: 0

plot:
  dpi: 150
  max_points_3d: 4096           # subsample the 3D scatter above this
